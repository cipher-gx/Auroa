spring.application.name=auroa
server.port=8080

# Busca el .env tanto en la carpeta actual como dentro de la subcarpeta auroa/
spring.config.import=optional:file:.env[.properties],optional:file:./auroa/.env[.properties]

# Usar las variables en el .env para conectar a PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de Spring Data JPA y PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Configuracion de Google gemini 
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true